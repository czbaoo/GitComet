name: Build Windows (fetch-feature)

# 仅在 fetch-feature 分支推送或手动触发时构建。
# 在 GitHub 托管的 Windows runner 上原生编译，gpui 会在编译期用系统
# d3dcompiler 把着色器预编译进 exe，无需任何交叉编译补丁。
on:
  push:
    branches: [fetch-feature]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-windows:
    name: Build gitcomet.exe (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain 必须显式传 toolchain（不会自动读 rust-toolchain.toml）。
        # 与仓库 rust-toolchain.toml 的 channel = "1.98" 保持一致，并装上同款组件。
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98
          components: rustfmt, clippy

      - name: Cache cargo registry, index and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build -p gitcomet --release --locked --features ui-gpui,gix --bin gitcomet

      - name: Upload gitcomet.exe
        uses: actions/upload-artifact@v4
        with:
          name: gitcomet-windows-x64
          path: target/release/gitcomet.exe
          if-no-files-found: error
