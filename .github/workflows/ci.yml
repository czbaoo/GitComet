name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-exe:
    name: Build Windows exe
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Fork-local: CI only compiles the Windows release exe. Tests, benchmark
      # target compilation, and fmt/audit lanes were removed; the release
      # pipeline in build-release-artifacts.yml is unchanged.
      - name: Build release binary
        shell: pwsh
        env:
          # MSVC keeps debug info in the .pdb, and this is what makes the linker
          # emit one: `strip` is ignored entirely on MSVC (rustc's MsvcLinker
          # passes /DEBUG unconditionally), so it is not the knob here.
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: cargo build -p gitcomet --release --locked --features ui-gpui,gix --bin gitcomet
      - name: Upload exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitcomet-windows-x64
          path: target/release/gitcomet.exe
          if-no-files-found: error
